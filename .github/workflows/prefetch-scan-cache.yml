name: Update Daily Market Cache

on:
  schedule:
    # The later retries cover a token that was issued after the prior day's
    # primary slot. Encrypted token reuse and job concurrency make completed
    # retries no-ops without issuing another token.
    - cron: "47 6 * * 1-5" # 15:47 KST, Monday-Friday
    - cron: "47 7 * * 1-5" # 16:47 KST backup, Monday-Friday
    - cron: "47 8 * * 1-5" # 17:47 KST final backup, Monday-Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    concurrency:
      group: daily-kis-market-cache
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: KIS_APP_KEY
    env:
      # A manual recovery run may safely collect the latest completed trading
      # day before today's close or on a weekend.
      ALLOW_OFF_HOURS: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout main
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update priority caches and persist encrypted token
        id: priority
        continue-on-error: true
        timeout-minutes: 15
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python prefetch_scan_cache.py --phase priority

      - name: Record interrupted priority stage
        if: steps.priority.outcome == 'failure'
        run: python prefetch_scan_cache.py --mark-workflow-failure priority

      - name: Commit priority caches and encrypted token
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/program_trade_cache.json data/us_liquidity_cache.json data/kis_batch_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update priority market caches"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Update flow scanner with the persisted token
        id: scanner
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 38
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python prefetch_scan_cache.py --phase scanner

      - name: Record interrupted scanner stage
        if: steps.scanner.outcome == 'failure'
        run: python prefetch_scan_cache.py --mark-workflow-failure scanner

      - name: Commit scanner cache and final batch status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan_cache.json data/kis_batch_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update daily flow scanner cache"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report collection failure
        if: steps.priority.outcome == 'failure' || steps.scanner.outcome == 'failure'
        run: exit 1
