
name: Prefetch Scan Cache

on:
  schedule:
    # KST 15:10~16:30 target window. Start early so a delayed GitHub runner can
    # pre-issue a 24h KIS token and wait until same-day data opens at 15:40.
    # The job below allows delayed runs until 20:00, but skips if today's cache already exists.
    - cron: "10,20,30 6 * * 1-5"
    - cron: "40,45,50,55 6 * * 1-5"
    - cron: "0,5,10,15,20,25,30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prefetch:
    concurrency:
      group: prefetch-scan-cache
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: KIS_APP_KEY

    steps:
      - name: Check KST prefetch window
        id: window
        run: |
          KST_DAY="$(TZ=Asia/Seoul date +%u)"
          KST_HM="$(TZ=Asia/Seoul date +%H%M)"
          echo "event=$GITHUB_EVENT_NAME kst_day=$KST_DAY kst_hm=$KST_HM"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_prefetch=true" >> "$GITHUB_OUTPUT"
          elif [ "$KST_DAY" -le 5 ] && [ "$KST_HM" -ge 1510 ] && [ "$KST_HM" -le 2000 ]; then
            echo "run_prefetch=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_prefetch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.window.outputs.run_prefetch == 'true'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Refresh latest main
        if: steps.window.outputs.run_prefetch == 'true'
        run: git pull --ff-only origin main

      - name: Check existing scan cache
        id: cache
        if: steps.window.outputs.run_prefetch == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          # Prefetch is preparing today's same-day scan. Before 15:40, do not
          # treat yesterday's cache as up to date or the early warm-up job will skip.
          target = now
          while target.weekday() > 4:
              target -= timedelta(days=1)
          target_date = target.strftime("%Y%m%d")

          def cache_has_target_date(cache, target_date):
              if cache.get("target_date") != target_date:
                  return False
              markets = cache.get("markets", {})
              for key in ("kospi200", "kosdaq150"):
                  market = markets.get(key, {})
                  if market.get("target_date") != target_date:
                      return False
                  summary = market.get("summary", {})
                  if not summary or not market.get("direction_groups"):
                      return False
                  market_size = market.get("market_size", 0)
                  scanned = summary.get("scanned", 0)
                  if isinstance(market_size, int) and market_size > 20 and scanned < int(market_size * 0.8):
                      return False
              return True

          path = Path("data/scan_cache.json")
          cache = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          up_to_date = cache_has_target_date(cache, target_date)
          print(f"target_date={target_date}")
          print(f"up_to_date={'true' if up_to_date else 'false'}")
          PY

      - name: Set up Python
        if: steps.window.outputs.run_prefetch == 'true' && steps.cache.outputs.up_to_date != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.window.outputs.run_prefetch == 'true' && steps.cache.outputs.up_to_date != 'true'
        run: pip install -r requirements.txt

      - name: Build scan cache
        if: steps.window.outputs.run_prefetch == 'true' && steps.cache.outputs.up_to_date != 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python prefetch_scan_cache.py

      - name: Commit updated cache
        if: steps.window.outputs.run_prefetch == 'true' && steps.cache.outputs.up_to_date != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan_cache.json
          git diff --cached --quiet && exit 0
          git commit -m "Update daily scan cache"
          git pull --rebase origin main
          git push origin HEAD:main
