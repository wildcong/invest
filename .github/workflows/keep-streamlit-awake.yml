name: Keep Streamlit Awake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-streamlit-awake.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test rendered-app monitoring
        run: node --test tests/test_streamlit_probe.mjs

      - name: Resolve app URL
        id: resolve
        env:
          STREAMLIT_APP_URL_VAR: ${{ vars.STREAMLIT_APP_URL }}
          STREAMLIT_APP_URL_SECRET: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          APP_URL="${STREAMLIT_APP_URL_VAR:-$STREAMLIT_APP_URL_SECRET}"
          if [ -z "$APP_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "STREAMLIT_APP_URL is not configured."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Install Playwright core
        if: steps.resolve.outputs.skip == 'false'
        timeout-minutes: 3
        run: |
          which google-chrome
          npm install playwright-core@1.54.2

      - name: Wake Streamlit app in headless browser
        if: steps.resolve.outputs.skip == 'false'
        timeout-minutes: 8
        env:
          APP_URL: ${{ steps.resolve.outputs.app_url }}
        run: |
          cat > wake-streamlit.mjs <<'EOF'
          import { chromium } from "playwright-core";
          import { waitForApp } from "./streamlit_probe.mjs";

          const rawAppUrl = (process.env.APP_URL || "").trim();
          if (!rawAppUrl) throw new Error("APP_URL is missing.");
          const target = new URL(rawAppUrl);
          target.searchParams.set("keepawake", "1");
          const browser = await chromium.launch({ channel: "chrome", headless: true });
          const page = await browser.newPage();
          try {
            const response = await page.goto(target.toString(), {
              waitUntil: "domcontentloaded", timeout: 120000,
            });
            if (!response || response.status() >= 500) {
              throw new Error("The Streamlit navigation failed.");
            }
            await waitForApp(page, "📊 국내 수급 스캐너");
          } finally {
            await browser.close();
          }
          EOF

          node wake-streamlit.mjs
