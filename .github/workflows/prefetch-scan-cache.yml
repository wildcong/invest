name: Update Daily Market Cache

on:
  schedule:
    # 16:00 KST, Monday-Friday. This is the only automatic KIS token issuer.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    concurrency:
      group: daily-kis-market-cache
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: KIS_APP_KEY

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update caches with one KIS token request at most
        id: update
        continue-on-error: true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python prefetch_scan_cache.py

      - name: Commit cache and daily token-request guard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan_cache.json data/program_trade_cache.json data/us_liquidity_cache.json data/kis_batch_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update daily market caches"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report collection failure
        if: steps.update.outcome == 'failure'
        run: exit 1
